[package]
name = "zcad-occt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ZCAD OpenCASCADE bindings for solid modeling operations"

[features]
default = []
# Enable OpenCASCADE integration (requires OCCT installed)
occt = []

[dependencies]
# Math and geometry
nalgebra = { workspace = true }

# Serialization
serde = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Internal dependencies
zcad-geometry-3d = { path = "../zcad-geometry-3d" }

# OpenCASCADE bindings (optional, requires system OCCT)
# opencascade = { version = "0.2", optional = true }

[dev-dependencies]
