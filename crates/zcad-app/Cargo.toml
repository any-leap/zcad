[package]
name = "zcad-app"
description = "ZCAD主应用程序"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["dwg"]
# DWG support via LibreDWG (requires LibreDWG and LLVM/Clang installed)
dwg = ["zcad-file/dwg"]

[[bin]]
name = "zcad"
path = "src/main.rs"

[dependencies]
zcad-core = { path = "../zcad-core" }
zcad-module = { path = "../zcad-module" }
zcad-renderer = { path = "../zcad-renderer" }
zcad-file = { path = "../zcad-file" }
zcad-ui = { path = "../zcad-ui" }

wgpu.workspace = true
egui.workspace = true
eframe.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

pollster = "0.4"
rfd = "0.15"  # 文件对话框
bytemuck = { version = "1", features = ["derive"] }
egui-wgpu.workspace = true

# 高性能 2D 渲染
tiny-skia.workspace = true
# 文字渲染
ab_glyph = "0.2"

# Vello GPU 2D 矢量渲染
vello = "0.6"

