[workspace]
resolver = "2"
members = [
    "crates/zcad-error",       # 统一错误处理
    "crates/zcad-core",        # 核心几何引擎 (2D)
    "crates/zcad-module",      # 模块系统
    "crates/zcad-geometry-3d", # 3D 几何内核
    "crates/zcad-occt",        # OpenCASCADE 绑定
    "crates/zcad-renderer",    # GPU渲染器
    "crates/zcad-libredwg",    # LibreDWG 绑定
    "crates/zcad-file",        # 文件格式处理
    "crates/zcad-ui",          # 用户界面
    "crates/zcad-mcad",        # MCAD 机械设计模块
    "crates/zcad-bim",         # BIM 建筑工程模块
    "crates/zcad-eda",         # EDA 电子设计模块
    "crates/zcad-app",         # 主应用程序
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ZCAD Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zcad/zcad"
rust-version = "1.83"

[workspace.dependencies]
# 几何与数学
nalgebra = { version = "0.33", features = ["serde-serialize"] }
parry2d = { version = "0.17", features = ["serde-serialize"] }
parry3d = { version = "0.17", features = ["serde-serialize"] }

# 渲染
wgpu = "27"
winit = "0.30"
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = "0.33"
eframe = { version = "0.33", default-features = false, features = ["wgpu", "default_fonts"] }

# 数据序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
zstd = "0.13"

# 异步与并发
tokio = { version = "1.42", features = ["full"] }
rayon = "1.10"
crossbeam = "0.8"

# 工具
thiserror = "2"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# 统一错误处理
zcad-error = { path = "crates/zcad-error" }

# DXF互操作
dxf = "0.6"

# Directories
dirs = "6"

# Approximate comparisons (for tests)
approx = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true      # 移除调试符号，减少体积
panic = "abort"   # 减少展开代码

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

